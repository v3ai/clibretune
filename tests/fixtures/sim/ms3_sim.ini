; ms3_sim.ini - a small synthetic ECU definition in the MegaSquirt-3 dialect, for the
; demo-mode tests (tests/test_sim_ms.c). Written for this project; not a MegaSquirt file. It
; uses the same wire formats as the real MS3 INIs: msEnvelope_1.0 framing, big-endian
; parameters, page identifiers "\$tsCanId\x04" filled in by %2i ("r%2i%2o%2c", "w%2i%2o%2c%v",
; "b%2i"), a page CRC command without a range ("k%2i\x00\x00\x00\x04"), a fixed realtime
; command with escapes, no [VeAnalyze], temperatures in degrees F, "INVALID" bits options.
; SPDX-License-Identifier: GPL-2.0-or-later

[MegaTune]
   queryCommand   = "Q"
   signature      = "MS3 Format 0238-sim"
   versionInfo    = "S"

[PcVariables]
   tsCanId        = bits, U08, [0:3], "CAN ID 0", "CAN ID 1", "CAN ID 2", "CAN ID 3"

[Constants]
   endianness          = big
   nPages              = 2
   pageSize            = 1024, 1024
   pageIdentifier      = "\$tsCanId\x04", "\$tsCanId\x05"
   burnCommand         = "b%2i",         "b%2i"
   pageReadCommand     = "r%2i%2o%2c",   "r%2i%2o%2c"
   pageValueWrite      = "w%2i%2o%2c%v", "w%2i%2o%2c%v"
   pageChunkWrite      = "w%2i%2o%2c%v", "w%2i%2o%2c%v"
   crc32CheckCommand   = "k%2i\x00\x00\x00\x04", "k%2i\x00\x00\x00\x04"
   messageEnvelopeFormat = msEnvelope_1.0
   pageActivationDelay = 1
   blockReadTimeout    = 300
   writeBlocks         = on
   interWriteDelay     = 0

page = 1
   nCylinders     = bits,   U08,   0, [0:4], "INVALID", "1", "2", "3", "4", "5", "6", "7", "8"
   algorithm      = bits,   U08,   1, [0:2], "INVALID", "Speed Density", "Percent Baro", "Alpha-N", "INVALID", "INVALID", "INVALID", "INVALID"
   twoStroke      = bits,   U08,   2, [0:0], "Four-stroke", "Two-stroke"
   reqFuel        = scalar, U16,   4, "ms",  0.001, 0.0, 0.0, 65.535, 2
   injOpen        = scalar, U16,   6, "ms",  0.001, 0.0, 0.0, 25.0, 3
   rpmLimit       = scalar, U16,   8, "RPM", 1.0,   0.0, 1000, 15000, 0

page = 2
   veTable1       = array,  U16,   0, [16x16], "%",   0.1, 0.0, 0.0, 255.0, 1
   frpm_table1    = array,  U16, 512, [16],    "RPM", 1.0, 0.0, 0.0, 15000, 0
   fmap_table1    = array,  S16, 544, [16],    "kPa", 0.1, 0.0, 0.0, 400.0, 1
   afrTable1      = array,  U08, 576, [12x12], "AFR", 0.1, 0.0, 9.0, 20.0,  1
   arpm_table1    = array,  U16, 720, [12],    "RPM", 1.0, 0.0, 0.0, 15000, 0
   amap_table1    = array,  S16, 744, [12],    "kPa", 0.1, 0.0, 0.0, 400.0, 1

[BurstMode]
   getCommand     = "A"

[OutputChannels]
   ochGetCommand  = "r\$tsCanId\x07\x00\x00\x00\x30"
   ochBlockSize   = 48
   seconds        = scalar, U16,  0, "s",     1.0,   0.0
   pulseWidth1    = scalar, U16,  2, "ms",    0.001, 0.0
   rpm            = scalar, U16,  6, "RPM",   1.0,   0.0
   advance        = scalar, S16,  8, "deg",   0.1,   0.0
   engine         = scalar, U08, 11, "bit",   1.0,   0.0
   ready          = bits,   U08, 11, [0:0]
   crank          = bits,   U08, 11, [1:1]
   afrtgt1        = scalar, U08, 12, "AFR",   0.1,   0.0
   barometer      = scalar, S16, 16, "kPa",   0.1,   0.0
   map            = scalar, S16, 18, "kPa",   0.1,   0.0
   mat            = scalar, S16, 20, "deg F", 0.1,   0.0
   coolant        = scalar, S16, 22, "deg F", 0.1,   0.0
   tps            = scalar, S16, 24, "%",     0.1,   0.0
   batteryVoltage = scalar, S16, 26, "v",     0.1,   0.0
   afr1           = scalar, S16, 28, "AFR",   0.1,   0.0
   egoCorrection1 = scalar, S16, 34, "%",     0.1,   0.0

[TableEditor]
   table = veTable1Tbl, veTable1Map, "VE Table 1", 2
      xBins = frpm_table1, rpm
      yBins = fmap_table1, map
      zBins = veTable1
   table = afrTable1Tbl, afrTable1Map, "AFR Table 1", 2
      xBins = arpm_table1, rpm
      yBins = amap_table1, map
      zBins = afrTable1

[Menu]
   menuDialog = main
   menu = "&Basic/Load Settings"
      subMenu = engine,       "Engine and sequential settings"
      subMenu = veTable1Tbl,  "Fuel VE Table 1"
      subMenu = afrTable1Tbl, "AFR Table 1"

[UserDefined]
   dialog = engine, "Engine and sequential settings"
      field = "Control algorithm",   algorithm
      field = "Required fuel",       reqFuel
      field = "Number of cylinders", nCylinders
      field = "Engine stroke",       twoStroke
      field = "Injector open time",  injOpen
      field = "Rev limit",           rpmLimit

[GaugeConfigurations]
   gaugeCategory = "Main"
   tachometer = rpm,     "Engine Speed", "RPM",   0, 8000, 300, 600, 6000, 7000, 0, 0
   mapGauge   = map,     "MAP",          "kPa",   0, 255,  0,   20,  200,  245,  0, 0
   cltGauge   = coolant, "Coolant",      "deg F", -40, 260, -40, 32, 220, 240, 0, 0
   afr1Gauge  = afr1,    "AFR",          "AFR",   10, 19.4, 12, 13, 15, 16, 1, 1

[FrontPage]
   gauge1 = tachometer
   gauge2 = mapGauge
   gauge3 = cltGauge
   gauge4 = afr1Gauge
   indicator = { ready }, "Not Ready", "Ready", white, black, green, black
