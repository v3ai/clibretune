; ms1_sim.ini - a small synthetic ECU definition in the dialect of the original MegaSquirt-I
; B&G 2.x/3.x firmware with spark (MSnS), for the demo-mode tests (tests/test_sim_ms.c).
; Written for this project; not a MegaSquirt file. Same wire formats as those INIs: a plain
; link at the ECU's pace, "Q" answered with ONE byte (the code version: signature = 30), two
; pages read whole by "V" and "I" (no page selection, no offset), one-byte value writes
; "W%o%v" / "J%o%v" (no chunk write: " "), one "B" that burns both pages, the 22-byte "A"
; realtime block of raw ADC counts.
; blockingFactor is set below the page size only to prove that a read command without an
; offset reads the whole page in one go.
; SPDX-License-Identifier: GPL-2.0-or-later

[MegaTune]
   queryCommand   = "Q"
   signature      = 30

[Constants]
   endianness          = big
   nPages              = 2
   burnCommand         = "B"
   pageSize            = 125,     95
   pageActivationDelay = 10
   pageActivate        = "",      ""
   pageReadCommand     = "V",     "I"
   pageValueWrite      = "W%o%v", "J%o%v"
   pageChunkWrite      = " ",     " "
   blockingFactor      = 64

page = 1
   veTable    = array,  U08,   0, [8x8], "%",    1.0,     0.0,   0.0, 255.0,   0
   crankCold  = scalar, U08,  64,        "ms",   0.1,     0.0,   0.0,  25.5,   1
   crankHot   = scalar, U08,  65,        "ms",   0.1,     0.0,   0.0,  25.5,   1
   wueBins    = array,  U08,  68, [10],  "%",    1.0,     0.0, 100.0, 255.0,   0
   reqFuel    = scalar, U08,  90,        "ms",   0.1,     0.0,   0.0,  25.5,   1
   injOpen    = scalar, U08,  93,        "ms",   0.1,     0.0,   0.1,  25.5,   1
   rpmBins    = array,  U08, 100, [8],   "RPM",  100.0,   0.0, 100.0, 25500.0, 0
   mapBins    = array,  U08, 108, [8],   "kPa",  1.0,     0.0,   0.0, 255.0,   0
   algorithm  = bits,   U08, 118, [2:2], "Speed Density", "Alpha-N"
   twoStroke  = bits,   U08, 116, [2:2], "Four-stroke", "Two-stroke"

page = 2
   advTable   = array,  U08,   0, [8x8], "deg",  0.352, -28.4, -10.0,  45.0,   1
   srpmBins   = array,  U08,  64, [8],   "RPM",  100.0,   0.0, 100.0, 25500.0, 0
   smapBins   = array,  U08,  72, [8],   "kPa",  1.0,     0.0,   0.0, 255.0,   0
   trigOffset = scalar, U08,  80,        "deg",  0.352, -28.4, -10.0,  80.0,   1

[OutputChannels]
   ochBlockSize   = 22
   secl           = scalar, U08,  0, "sec",  1.0, 0.0
   squirt         = scalar, U08,  1, "bits", 1.0, 0.0
   engine         = scalar, U08,  2, "bits", 1.0, 0.0
   baroADC        = scalar, U08,  3, "ADC",  1.0, 0.0
   mapADC         = scalar, U08,  4, "ADC",  1.0, 0.0
   matADC         = scalar, U08,  5, "ADC",  1.0, 0.0
   cltADC         = scalar, U08,  6, "ADC",  1.0, 0.0
   tpsADC         = scalar, U08,  7, "ADC",  1.0, 0.0
   batADC         = scalar, U08,  8, "ADC",  1.0, 0.0
   egoADC         = scalar, U08,  9, "ADC",  1.0, 0.0
   egoCorrection  = scalar, U08, 10, "%",    1.0, 0.0
   rpm100         = scalar, U08, 13, "r100", 1.0, 0.0
   pulseWidth     = scalar, U08, 14, "ms",   0.1, 0.0
   veCurr         = scalar, U08, 18, "%",    1.0, 0.0
   rpm            = { rpm100 * 100 }
   map            = { (mapADC / 255.0 + 0.04) * 250.0 }
   batteryVoltage = { batADC / 255.0 * 30.0 }
   running        = { engine & 1 }

[TableEditor]
   table = veTableTbl, veTableMap, "VE Table", 1
      xBins = rpmBins, rpm
      yBins = mapBins, map
      zBins = veTable
   table = advTableTbl, advTableMap, "Spark Advance", 2
      xBins = srpmBins, rpm
      yBins = smapBins, map
      zBins = advTable

[Menu]
   menuDialog = main
   menu = "&Settings"
      subMenu = engine,      "Engine constants"
      subMenu = veTableTbl,  "VE Table"
      subMenu = advTableTbl, "Spark Advance"

[UserDefined]
   dialog = engine, "Engine constants"
      field = "Required fuel",      reqFuel
      field = "Injector open time", injOpen
      field = "Control algorithm",  algorithm
      field = "Engine stroke",      twoStroke
      field = "Trigger offset",     trigOffset

[GaugeConfigurations]
   gaugeCategory = "Main"
   tachometer = rpm,            "Engine Speed", "RPM",  0, 8000, 300, 600, 6000, 7000, 0, 0
   mapGauge   = map,            "MAP",          "kPa",  0, 255,  0,   20,  200,  245,  0, 0
   batGauge   = batteryVoltage, "Battery",      "V",    7, 21,   8,   10,  15,   16,   1, 1

[FrontPage]
   gauge1 = tachometer
   gauge2 = mapGauge
   gauge3 = batGauge
