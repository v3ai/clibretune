; ms2_sim.ini - a small synthetic ECU definition in the dialect of the original MegaSquirt-II
; 2.x firmware, for the demo-mode tests (tests/test_sim_ms.c). Written for this project; not a
; MegaSquirt file. Same wire formats as those INIs: a plain link, big-endian parameters, page
; identifiers "\x00\x04" filled in by %2i, and a three-byte burst command "a\x00\x06"
; (command, CAN id, table) for realtime data.
; SPDX-License-Identifier: GPL-2.0-or-later

[MegaTune]
   queryCommand   = "Q"
   signature      = "MSII Rev 2.88-sim"
   versionInfo    = "S"

[Constants]
   endianness          = big
   nPages              = 2
   pageSize            = 994, 512
   pageIdentifier      = "\x00\x04",     "\x00\x05"
   burnCommand         = "b%2i",         "b%2i"
   pageReadCommand     = "r%2i%2o%2c",   "r%2i%2o%2c"
   pageValueWrite      = "w%2i%2o%2c%v", "w%2i%2o%2c%v"
   pageChunkWrite      = "w%2i%2o%2c%v", "w%2i%2o%2c%v"
   pageActivationDelay = 50
   blockReadTimeout    = 200

page = 1
   nCylinders     = bits,   U08,   0, [0:4], "INVALID", "1", "2", "3", "4", "5", "6", "7", "8"
   algorithm      = bits,   U08,   1, [0:2], "INVALID", "Speed Density", "Percent Baro", "Alpha-N", "INVALID", "INVALID", "INVALID", "INVALID"
   twoStroke      = bits,   U08,   2, [0:0], "Four-stroke", "Two-stroke"
   reqFuel        = scalar, U16,   4, "ms",  0.001, 0.0, 0.0, 65.535, 2
   injOpen        = scalar, U16,   6, "ms",  0.001, 0.0, 0.0, 25.0, 3
   rpmLimit       = scalar, U16,   8, "RPM", 1.0,   0.0, 1000, 15000, 0

page = 2
   veTable1       = array,  U08,   0, [16x16], "%",   1.0, 0.0, 0.0, 255.0, 0
   frpm_table1    = array,  U16, 256, [16],    "RPM", 1.0, 0.0, 0.0, 15000, 0
   fmap_table1    = array,  S16, 288, [16],    "kPa", 0.1, 0.0, 0.0, 400.0, 1
   afrTable1      = array,  U08, 320, [12x12], "AFR", 0.1, 0.0, 9.0, 20.0,  1
   arpm_table1    = array,  U16, 464, [12],    "RPM", 1.0, 0.0, 0.0, 15000, 0
   amap_table1    = array,  S16, 488, [12],    "kPa", 0.1, 0.0, 0.0, 400.0, 1

[BurstMode]
   getCommand     = "a\x00\x06"

[OutputChannels]
   ochGetCommand  = "a\x00\x06"
   ochBlockSize   = 48
   seconds        = scalar, U16,  0, "s",     1.0,   0.0
   rpm            = scalar, U16,  6, "RPM",   1.0,   0.0
   advance        = scalar, S16,  8, "deg",   0.1,   0.0
   engine         = scalar, U08, 11, "bit",   1.0,   0.0
   ready          = bits,   U08, 11, [0:0]
   crank          = bits,   U08, 11, [1:1]
   barometer      = scalar, S16, 16, "kPa",   0.1,   0.0
   map            = scalar, S16, 18, "kPa",   0.1,   0.0
   mat            = scalar, S16, 20, "deg F", 0.1,   0.0
   coolant        = scalar, S16, 22, "deg F", 0.1,   0.0
   tps            = scalar, S16, 24, "%",     0.1,   0.0
   batteryVoltage = scalar, S16, 26, "v",     0.1,   0.0
   afr1           = scalar, S16, 28, "AFR",   0.1,   0.0

[TableEditor]
   table = veTable1Tbl, veTable1Map, "VE Table 1", 2
      xBins = frpm_table1, rpm
      yBins = fmap_table1, map
      zBins = veTable1
   table = afrTable1Tbl, afrTable1Map, "AFR Table 1", 2
      xBins = arpm_table1, rpm
      yBins = amap_table1, map
      zBins = afrTable1

[Menu]
   menuDialog = main
   menu = "&Basic setup"
      subMenu = engine,       "Engine constants"
      subMenu = veTable1Tbl,  "Fuel VE Table 1"
      subMenu = afrTable1Tbl, "AFR Table 1"

[UserDefined]
   dialog = engine, "Engine constants"
      field = "Control algorithm",   algorithm
      field = "Required fuel",       reqFuel
      field = "Number of cylinders", nCylinders
      field = "Engine stroke",       twoStroke
      field = "Injector open time",  injOpen
      field = "Rev limit",           rpmLimit

[GaugeConfigurations]
   gaugeCategory = "Main"
   tachometer = rpm,     "Engine Speed", "RPM",   0, 8000, 300, 600, 6000, 7000, 0, 0
   mapGauge   = map,     "MAP",          "kPa",   0, 255,  0,   20,  200,  245,  0, 0
   cltGauge   = coolant, "Coolant",      "deg F", -40, 260, -40, 32, 220, 240, 0, 0
   afr1Gauge  = afr1,    "AFR",          "AFR",   10, 19.4, 12, 13, 15, 16, 1, 1

[FrontPage]
   gauge1 = tachometer
   gauge2 = mapGauge
   gauge3 = cltGauge
   gauge4 = afr1Gauge
   indicator = { ready }, "Not Ready", "Ready", white, black, green, black
