; ms1extra_sim.ini - a small synthetic ECU definition in the dialect of the MegaSquirt-I
; Extra firmwares (MSnS-extra / MS1-Extra), for the demo-mode tests (tests/test_sim_ms.c).
; Written for this project; not a MegaSquirt file. Same wire formats as those INIs: a plain
; link; "S" signature and "T" version text; one page in ECU RAM at a time, selected with
; pageActivate "P\001" (octal escapes, page numbers not in INI order) and
; pageActivationDelay; every page read whole by the same "V"; chunk writes "X%o%c%v" and
; one-byte value writes "W%o%v" (one-byte offset and count); one "B" for every page (it
; burns the selected one); realtime "R" from ochGetCommand with no [BurstMode] command.
; The third page declares no chunk write, so it is written a byte at a time.
; SPDX-License-Identifier: GPL-2.0-or-later

[MegaTune]
   queryCommand = "S"
   versionInfo  = "T"
   signature    = "MSnS-extra comms-sim ***********"

[Constants]
   endianness          = big
   nPages              = 3
   burnCommand         = "B"
   pageSize            = 200,       200,       189
   pageActivate        = "P\001",   "P\002",   "P\000"
   pageReadCommand     = "V",       "V",       "V"
   pageValueWrite      = "W%o%v",   "W%o%v",   "W%o%v"
   pageChunkWrite      = "X%o%c%v", "X%o%c%v", ""
   pageActivationDelay = 50
   writeBlocks         = on
   interWriteDelay     = 0

page = 1
   reqFuel    = scalar, U08,  90,        "ms",   0.1,   0.0,   0.0,  25.5,   1
   injOpen    = scalar, U08,  93,        "ms",   0.1,   0.0,   0.1,  25.5,   1
   dwell      = scalar, U16, 150,        "ms",   0.1,   0.0,   1.0,  10.0,   1
   algorithm  = bits,   U08, 118, [2:2], "Speed Density", "Alpha-N"

page = 2
   veTable    = array,  U08,   0, [12x12], "%",   1.0,   0.0,   0.0, 255.0,   0
   rpmBins    = array,  U08, 144, [12],    "RPM", 100.0, 0.0, 100.0, 25500.0, 0
   mapBins    = array,  U08, 156, [12],    "kPa", 1.0,   0.0,   0.0, 255.0,   0

page = 3
   advTable   = array,  U08,   0, [8x8], "deg",  0.352, -28.4, -10.0,  45.0,   1
   srpmBins   = array,  U08,  64, [8],   "RPM",  100.0,   0.0, 100.0, 25500.0, 0
   smapBins   = array,  U08,  72, [8],   "kPa",  1.0,     0.0,   0.0, 255.0,   0
   trigOffset = scalar, U08, 180,        "deg",  0.352, -28.4, -10.0,  80.0,   1

[OutputChannels]
   ochGetCommand  = "R"
   ochBlockSize   = 38
   secl           = scalar, U08,  0, "sec",  1.0, 0.0
   engine         = scalar, U08,  2, "bits", 1.0, 0.0
   baroADC        = scalar, U08,  3, "ADC",  1.0, 0.0
   mapADC         = scalar, U08,  4, "ADC",  1.0, 0.0
   matADC         = scalar, U08,  5, "ADC",  1.0, 0.0
   cltADC         = scalar, U08,  6, "ADC",  1.0, 0.0
   tpsADC         = scalar, U08,  7, "ADC",  1.0, 0.0
   batADC         = scalar, U08,  8, "ADC",  1.0, 0.0
   egoADC         = scalar, U08,  9, "ADC",  1.0, 0.0
   rpm100         = scalar, U08, 13, "r100", 1.0, 0.0
   pulseWidth1    = scalar, U08, 14, "ms",   0.1, 0.0
   advance        = scalar, U08, 24, "deg",  1.0, 0.0
   iTimeX         = scalar, U08, 37, "s",    1.0, 0.0
   rpm            = { rpm100 * 100 }
   map            = { (mapADC / 255.0 + 0.04) * 250.0 }
   batteryVoltage = { batADC / 255.0 * 30.0 }

[TableEditor]
   table = veTableTbl, veTableMap, "VE Table", 2
      xBins = rpmBins, rpm
      yBins = mapBins, map
      zBins = veTable
   table = advTableTbl, advTableMap, "Spark Advance", 3
      xBins = srpmBins, rpm
      yBins = smapBins, map
      zBins = advTable

[Menu]
   menuDialog = main
   menu = "&Settings"
      subMenu = engine,      "Engine constants"
      subMenu = veTableTbl,  "VE Table"
      subMenu = advTableTbl, "Spark Advance"

[UserDefined]
   dialog = engine, "Engine constants"
      field = "Required fuel",      reqFuel
      field = "Injector open time", injOpen
      field = "Dwell",              dwell
      field = "Control algorithm",  algorithm
      field = "Trigger offset",     trigOffset

[GaugeConfigurations]
   gaugeCategory = "Main"
   tachometer = rpm,            "Engine Speed", "RPM",  0, 8000, 300, 600, 6000, 7000, 0, 0
   mapGauge   = map,            "MAP",          "kPa",  0, 255,  0,   20,  200,  245,  0, 0
   batGauge   = batteryVoltage, "Battery",      "V",    7, 21,   8,   10,  15,   16,   1, 1

[FrontPage]
   gauge1 = tachometer
   gauge2 = mapGauge
   gauge3 = batGauge
