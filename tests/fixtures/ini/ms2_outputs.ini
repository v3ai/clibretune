; ms2_outputs.ini - a small MegaSquirt-2 (MS2/Extra style) ECU definition for the programmable
; on/off output ("Output Port Settings", std_port_edit) tests and screenshots.
; The [PortEditor] section and the ps* arrays follow the MS2/Extra layout: one element per
; port, operators and the and/or relationship stored as character codes, thresholds in raw
; channel units, the channel chosen by its offset/size in the realtime block. The protocol
; part uses the msEnvelope framing of the bundled demo so demo mode runs it.

[SettingGroups]
	settingGroup = CELSIUS, "Temperatures in Celsius"
	settingGroup = mcu, "Processor"
	settingOption = DEFAULT, "MS2 (MC9S12C64)"
	settingOption = mcu_ms3, "MS3 (MC9S12XEP100)"

[MegaTune]
	signature	= "MS2Extra comms342hP"

[TunerStudio]
	queryCommand	= "Q"
	signature	= "MS2Extra comms342hP"

[Constants]
	messageEnvelopeFormat = msEnvelope_1.0
	endianness		= big
	nPages			= 1
	pageIdentifier		= "\x00\x04"
	pageSize		= 512
	pageReadCommand		= "R%2i%2o%2c"
	burnCommand		= "B%2i"
	pageValueWrite		= "C%2i%2o%2c%v"
	pageChunkWrite		= "C%2i%2o%2c%v"
	crc32CheckCommand	= "k%2i%2o%2c"
	blockingFactor		= 256

page = 1
	nCylinders	= bits,   U08, 0, [0:3], "INVALID", "1", "2", "3", "4", "5", "6", "7", "8"
	reqFuel		= scalar, U16, 2, "ms", 0.001, 0, 0, 25.5, 3
#if CELSIUS
	fastIdleT	= scalar, S16, 4, "C", 0.05555, -320, -40, 150, 1
#else
	fastIdleT	= scalar, S16, 4, "F", 0.1, 0, -40, 300, 1
#endif
#if mcu_ms3
	sparkMode	= bits,   U08, 6, [0:2], "EDIS", "Basic Trigger", "Toothed Wheel", "Dual Wheel", "Chevy LT1", "Nissan", "Subaru 6/7", "4G63"
#else
	sparkMode	= bits,   U08, 6, [0:2], "EDIS", "Basic Trigger", "Toothed Wheel", "Dual Wheel", "INVALID", "INVALID", "INVALID", "INVALID"
#endif
	idlePin		= bits,   U08, 7, [0:3], "NONE", "PM3", "PM4", "PM5", "PT6", "PT7", "PA0", "PT5", "PT4"
	tachoPin	= bits,   U08, 8, [0:3], "NONE", "PM3", "PM4", "PM5", "PT6", "PT7", "PA0", "PT5", "PT4"
	; programmable on/off outputs: 8 ports
	psEnabled	= array,  U08,  16, [8], "",     1, 0, 0, 1, 0
	psCondition	= array,  U08,  24, [8], "",     1, 0, 0, 255, 0
	psConnector	= array,  U08,  32, [8], "",     1, 0, 0, 255, 0
	psInitValue	= array,  U08,  40, [8], "",     1, 0, 0, 1, 0
	psPortValue	= array,  U08,  48, [8], "",     1, 0, 0, 1, 0
	psOutSize	= array,  U08,  56, [8], "",     1, 0, 0, 4, 0
	psOutOffset	= array,  U16,  64, [8], "",     1, 0, 0, 511, 0
	psThreshold	= array,  S16,  80, [8], "",     1, 0, -32768, 32767, 0
	psHysteresis	= array,  S16,  96, [8], "",     1, 0, 0, 32767, 0
	psCondition2	= array,  U08, 112, [8], "",     1, 0, 0, 255, 0
	psOutSize2	= array,  U08, 120, [8], "",     1, 0, 0, 4, 0
	psOutOffset2	= array,  U16, 128, [8], "",     1, 0, 0, 511, 0
	psThreshold2	= array,  S16, 144, [8], "",     1, 0, -32768, 32767, 0
	psHysteresis2	= array,  S16, 160, [8], "",     1, 0, 0, 32767, 0
	; a small curve and table so dialogs have something to embed
	wueBins		= array,  S16, 176, [6], "C",   0.1, 0, -40, 200, 1
	wueRates	= array,  U08, 188, [6], "%",   1, 0, 100, 255, 0
	veRpm		= array,  U16, 194, [4], "RPM", 1, 0, 0, 10000, 0
	veLoad		= array,  U16, 202, [4], "kPa", 0.1, 0, 0, 400, 1
	veTable1	= array,  U08, 210, [4x4], "%", 1, 0, 0, 255, 0

[Defaults]
	defaultValue = nCylinders, 4

[ConstantsExtensions]
	requiresPowerCycle = nCylinders
	requiresPowerCycle = sparkMode

[OutputChannels]
	ochGetCommand	= "O%2o%2c"
	ochBlockSize	= 64

	seconds		= scalar, U16,  0, "s",   1.000, 0.0
	pulseWidth1	= scalar, U16,  2, "s",   0.000666, 0.0
	rpm		= scalar, U16,  6, "RPM", 1.000, 0.0
	advance		= scalar, S16,  8, "deg", 0.100, 0.0
	map		= scalar, S16, 18, "kPa", 0.100, 0.0
	mat		= scalar, S16, 20, "C",   0.100, 0.0
	coolant		= scalar, S16, 22, "C",   0.100, 0.0
	tps		= scalar, S16, 24, "%",   0.100, 0.0
	batteryVoltage	= scalar, S16, 26, "v",   0.100, 0.0
	afr1		= scalar, S16, 28, "AFR", 0.100, 0.0
	egoCorrection	= scalar, S16, 34, "%",   0.100, 0.0
	engine		= scalar, U08, 11, "bits", 1.000, 0.0
	ve		= scalar, U08, 13, "%",   1.000, 0.0
	ready		= bits,   U08, 11, [0:0]
	time		= { timeNow }

[Menu]
	menuDialog = main
	menu = "&Settings"
		subMenu = engineSetup,		"Engine and Sequential Settings"
		subMenu = warmupDialog,		"Warmup Enrichment"
		subMenu = std_separator
		subMenu = std_port_edit,	"Output Port Settings"
	menu = "Help"
		subMenu = portHelp,		"Programmable outputs"

[UserDefined]
	help = portHelp, "Programmable On/Off Outputs"
		webHelp = "https://www.msextra.com/doc/ms2extra/MS2-Extra_Setting_Up.htm"
		text = "Each port is switched when its condition is true.<br>"
		text = "Pick an output channel, an operator and a threshold; the hysteresis keeps the output from chattering."

	dialog = engineSetup, "Engine and Sequential Settings"
		topicHelp = "portHelp"
		field = "Number of cylinders",	nCylinders
		field = "Required fuel",	reqFuel
		field = "Fast idle threshold",	fastIdleT
		field = "Spark mode",		sparkMode
		field = "Idle valve output",	idlePin
		field = "Tacho output",		tachoPin

	dialog = warmupDialog, "Warmup Enrichment", border
		panel = wueCurve, Center
		panel = statusIndicators, East

	indicatorPanel = statusIndicators, 1
		indicator = { ready }, "Not ready", "Ready", white, black, green, black
		indicator = { rpm > 300 }, "Stopped", "Running", white, black, green, black

[CurveEditor]
	curve = wueCurve, "Warmup Enrichment (WUE)"
		columnLabel = "Coolant", "WUE"
		xAxis = -40, 120, 9
		yAxis = 100, 200, 5
		xBins = wueBins, coolant
		yBins = wueRates
		topicHelp = "portHelp"

[TableEditor]
	table = veTable1Tbl, veTable1Map, "VE Table 1", 1
		xBins = veRpm, rpm
		yBins = veLoad, map
		zBins = veTable1

[PortEditor]
	portEditor = std_port_edit, "Output Port Settings"
	topicHelp = "portHelp"
	enabledPorts = psEnabled, "PM3 - Injection LED D14", "PM4 - Accel LED D16", "PM5 - Warmup LED D15", "PT6 - IAC1", "PT7 - IAC2", "PA0 - Knock Enable", "PT5 - Boost", "PT4 - Nitrous"
	outputOffset = psOutOffset
	outputSize = psOutSize
	operators = psCondition, "<", "=", ">", "&"
	threshold = psThreshold
	hysteresis = psHysteresis
	powerOnValue = psInitValue
	triggerValue = psPortValue
	conditionRelationship = psConnector, " ", "&", "|"
	outputOffset2 = psOutOffset2
	outputSize2 = psOutSize2
	operators2 = psCondition2
	threshold2 = psThreshold2
	hysteresis2 = psHysteresis2
