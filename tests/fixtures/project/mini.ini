; Small Speeduino-style definition used by the tune tests.
[MegaTune]
   signature = "speeduino 202501-mini"
   queryCommand = "Q"
   versionInfo = "S"

[TunerStudio]
   iniSpecVersion = 3.64

[Constants]
   endianness = little
   nPages = 3
   pageSize = 128, 64, 40
   pageIdentifier = "\x00\x00", "\x00\x01", "\x00\x02"
   pageReadCommand = "p%2i%2o%2c", "p%2i%2o%2c", "p%2i%2o%2c"
   burnCommand = "b%2i", "b%2i", "b%2i"

page = 1
   nCylinders   = bits,   U08, 0, [0:3], "INVALID", "1", "2", "3", "4", "5", "6", "7", "8"
   twoStroke    = bits,   U08, 0, [4:4], "Four-stroke", "Two-stroke"
   injType      = bits,   U08, 0, [5:6], "Port", "Throttle Body", "Unused", "Unused"
   reqFuel      = scalar, U08, 1, "ms", 0.1, 0.0, 0.0, 25.5, 1
   divider      = scalar, U08, 2, "", 1.0, 0.0, 1, 12, 0
   fuelPressure = scalar, U16, 3, "kPa", 1.0, 0.0, 0, 1000, 0
   injOpen      = scalar, S16, 5, "ms", 0.1, 0.0, -10.0, 10.0, 1
   battVCorr    = scalar, U08, 7, "V", 0.1, -5.0, 0.0, 20.0, 1
   wueRates     = array,  U08, 8, [10], "%", 1.0, 0.0, 0, 255, 0
   wueBins      = array,  S16, 18, [10], "C", 1.0, -40.0, -40, 215, 0
   veTable      = array,  U08, 38, [4x4], "%", 1.0, 0.0, 0, 255, 0
   rpmBins      = array,  U08, 54, [4], "RPM", 100.0, 0.0, 0, 25500, 0
   loadBins     = array,  U08, 58, [4], "kPa", 2.0, 0.0, 0, 510, 0
   afrTarget    = array,  U08, 62, [4x4], "AFR", 0.1, 0.0, 7.0, 25.5, 1
   engineName   = string, ASCII, 78, 16
   calFactor    = scalar, F32, 94, "", 1.0, 0.0, -1000000.0, 1000000.0, 3
   bigCount     = scalar, U32, 98, "", 1.0, 0.0, 0, 4000000000, 0

page = 2
   advTable     = array,  S08, 0, [3x3], "deg", 1.0, 0.0, -40, 60, 0
   mapMin       = scalar, S16, 9, "kPa", 1.0, 0.0, -100, 500, 0
   sensorFlags  = bits,   U16, 12, [0:12], "a", "b"
   ovrBit       = bits,   U08, 14, [8:9], "x", "y", "z", "w"
   tpsDelta     = scalar, U08, 20, "%", 0.5, 0.0, 0, 100, 1

page = 3
   spare        = scalar, U08, 0, "", 1.0, 0.0, 0, 255, 0

[PcVariables]
   fuelUnits = bits, U08, [0:1], "kPa", "MAF", "%TPS"
   rpmhigh   = scalar, U16, "rpm", 1.0, 0.0, 0, 20000, 0

[Defaults]
   defaultValue = reqFuel, 8.5
   defaultValue = divider, 2
   defaultValue = nCylinders, 4
   defaultValue = fuelPressure, 300
   defaultValue = twoStroke, 0
   defaultValue = rpmhigh, 7000
   defaultValue = fuelUnits, 1

[OutputChannels]
   ochBlockSize = 8
   rpm  = scalar, U16, 0, "rpm", 1.0, 0.0
   map  = scalar, U08, 2, "kPa", 1.0, 0.0
   tps  = scalar, U08, 3, "%", 0.5, 0.0
   rpm2 = { rpm * 2 }

[TableEditor]
   table = veTbl, veTable1Map, "VE Table", 1
      xBins = rpmBins, rpm
      yBins = loadBins, map
      zBins = veTable
   table = advTbl, advMap, "Advance", 2
      xBins = rpmBins, rpm
      yBins = loadBins, map
      zBins = advTable

[ControllerCommands]
   cmdTestOn  = "E\x01\x02"
   cmdTestOff = "E\x01\x00"
