name: Release

# Tag push (v*) -> versioned release with native per-OS binaries.
# Push to main  -> rolling "nightly" pre-release, rebuilt on every commit.
on:
  push:
    branches: [main]
    tags: ["v*"]
    # Site-only changes don't need new binaries (path filters don't apply to tag pushes).
    paths-ignore: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-x86_64:
    # Oldest hosted runner: the binary links against its (older) glibc.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        env:
          CFLAGS: -O2
        run: |
          ./build.sh test
          ./build.sh app
          ./build/libretune --version
          mkdir -p dist
          cp build/libretune dist/libretune-linux-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: libretune-linux-x86_64
          path: dist/libretune-linux-x86_64

  linux-aarch64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        run: |
          ./build.sh test
          ./build.sh app
          ./build/libretune --version
          mkdir -p dist
          cp build/libretune dist/libretune-linux-aarch64
      - uses: actions/upload-artifact@v4
        with:
          name: libretune-linux-aarch64
          path: dist/libretune-linux-aarch64

  windows-x86_64:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc make
      - name: Build and test
        run: |
          ./build.sh test
          mkdir -p dist
          # Console build: --help/--version print to the terminal.
          LDFLAGS="-static" ./build.sh app
          ./build/libretune.exe --version
          cp build/libretune.exe dist/libretune-windows-x86_64.exe
          # GUI-subsystem build: no console window when double-clicked.
          rm -rf build/obj-*
          LDFLAGS="-static -mwindows" ./build.sh app
          cp build/libretune.exe dist/libretune-windows-x86_64-gui.exe
          ./build/libretune.exe --version || true
      - uses: actions/upload-artifact@v4
        with:
          name: libretune-windows-x86_64
          path: dist/*.exe

  macos-universal:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: ./build.sh test
      - name: Build universal binary
        run: |
          mkdir -p dist
          CFLAGS="-O2 -arch x86_64" LDFLAGS="-arch x86_64" ./build.sh app
          cp build/libretune build/libretune-x86_64
          CFLAGS="-O2 -arch arm64" LDFLAGS="-arch arm64" ./build.sh app
          cp build/libretune build/libretune-arm64
          lipo -create -output dist/libretune-macos-universal \
            build/libretune-x86_64 build/libretune-arm64
          codesign -s - --force dist/libretune-macos-universal
          lipo -info dist/libretune-macos-universal
          chmod +x dist/libretune-macos-universal
          ./dist/libretune-macos-universal --version
      - uses: actions/upload-artifact@v4
        with:
          name: libretune-macos-universal
          path: dist/libretune-macos-universal

  publish:
    needs: [linux-x86_64, linux-aarch64, windows-x86_64, macos-universal]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Collect files and checksums
        run: |
          cp tests/fixtures/ini/demo.ini dist/demo.ini
          cp packaging/linux/50-libretune.rules dist/50-libretune.rules
          chmod +x dist/libretune-linux-* dist/libretune-macos-universal
          cd dist
          sha256sum * > SHA256SUMS
          ls -l

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "LibreTune In Universal C ${GITHUB_REF_NAME}" \
            --notes-file .github/release-notes.md \
            --generate-notes

      - name: Publish nightly
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nightly --yes --cleanup-tag || true
          {
            cat .github/release-notes.md
            echo
            echo "Nightly build of \`${GITHUB_SHA::7}\`, rebuilt on every push to main."
          } > nightly-notes.md
          gh release create nightly dist/* \
            --prerelease \
            --target "${GITHUB_SHA}" \
            --title "Nightly ($(date -u +%Y-%m-%d) ${GITHUB_SHA::7})" \
            --notes-file nightly-notes.md
