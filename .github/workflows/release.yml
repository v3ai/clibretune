name: Release

# Tag push (v*)            -> versioned release with native per-OS binaries.
# Called with a version    -> the same, tagged v<version> at this commit (pages.yml calls it after
#                             every site deploy, so the site's download links serve a current build)
# Push to main             -> rolling "nightly" pre-release, rebuilt on every commit.
on:
  push:
    branches: [main]
    tags: ["v*"]
    # Site-only changes don't need new binaries (path filters don't apply to tag pushes).
    paths-ignore: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: "Release version without the v (e.g. 0.1.3)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}-${{ inputs.version || 'nightly' }}
  cancel-in-progress: ${{ inputs.version == '' }}

env:
  # The version the binaries report: the called version, else the pushed tag (build.sh drops the v).
  LT_VERSION: ${{ inputs.version || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}

jobs:
  linux-x86_64:
    # Oldest hosted runner: the binary links against its (older) glibc.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        env:
          CFLAGS: -O2
        run: |
          ./build.sh test
          ./build.sh app
          ./build/clibretune --version
          mkdir -p dist
          cp build/clibretune dist/clibretune-linux-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: clibretune-linux-x86_64
          path: dist/clibretune-linux-x86_64

  linux-aarch64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        run: |
          ./build.sh test
          ./build.sh app
          ./build/clibretune --version
          mkdir -p dist
          cp build/clibretune dist/clibretune-linux-aarch64
      - uses: actions/upload-artifact@v4
        with:
          name: clibretune-linux-aarch64
          path: dist/clibretune-linux-aarch64

  windows-x86_64:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc make
      - name: Build and test
        run: |
          ./build.sh test
          mkdir -p dist
          # Console build: --help/--version print to the terminal.
          LDFLAGS="-static" ./build.sh app
          ./build/clibretune.exe --version
          cp build/clibretune.exe dist/clibretune-windows-x86_64.exe
          # GUI-subsystem build: no console window when double-clicked.
          rm -rf build/obj-*
          LDFLAGS="-static -mwindows" ./build.sh app
          cp build/clibretune.exe dist/clibretune-windows-x86_64-gui.exe
          ./build/clibretune.exe --version || true
      - uses: actions/upload-artifact@v4
        with:
          name: clibretune-windows-x86_64
          path: dist/*.exe

  macos-universal:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: ./build.sh test
      - name: Build universal binary
        run: |
          mkdir -p dist
          CFLAGS="-O2 -arch x86_64" LDFLAGS="-arch x86_64" ./build.sh app
          cp build/clibretune build/clibretune-x86_64
          CFLAGS="-O2 -arch arm64" LDFLAGS="-arch arm64" ./build.sh app
          cp build/clibretune build/clibretune-arm64
          lipo -create -output dist/clibretune-macos-universal \
            build/clibretune-x86_64 build/clibretune-arm64
          codesign -s - --force dist/clibretune-macos-universal
          lipo -info dist/clibretune-macos-universal
          chmod +x dist/clibretune-macos-universal
          ./dist/clibretune-macos-universal --version
      - uses: actions/upload-artifact@v4
        with:
          name: clibretune-macos-universal
          path: dist/clibretune-macos-universal

  publish:
    needs: [linux-x86_64, linux-aarch64, windows-x86_64, macos-universal]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Collect files and checksums
        run: |
          cp tests/fixtures/ini/demo.ini dist/demo.ini
          cp packaging/linux/50-clibretune.rules dist/50-clibretune.rules
          chmod +x dist/clibretune-linux-* dist/clibretune-macos-universal
          cd dist
          sha256sum * > SHA256SUMS
          ls -l

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v') && inputs.version == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "clibretune ${GITHUB_REF_NAME}" \
            --notes-file .github/release-notes.md \
            --generate-notes

      - name: Publish versioned release
        if: inputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release create "v${VERSION}" dist/* \
            --target "${GITHUB_SHA}" \
            --latest \
            --title "clibretune v${VERSION}" \
            --notes-file .github/release-notes.md \
            --generate-notes

      - name: Publish nightly
        if: github.ref == 'refs/heads/main' && inputs.version == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nightly --yes --cleanup-tag || true
          {
            cat .github/release-notes.md
            echo
            echo "Nightly build of \`${GITHUB_SHA::7}\`, rebuilt on every push to main."
          } > nightly-notes.md
          gh release create nightly dist/* \
            --prerelease \
            --target "${GITHUB_SHA}" \
            --title "Nightly ($(date -u +%Y-%m-%d) ${GITHUB_SHA::7})" \
            --notes-file nightly-notes.md
